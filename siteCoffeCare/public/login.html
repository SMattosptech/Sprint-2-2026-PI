<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sistema Educativo de Lógica</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <a class="marca" href="index.html">
                <h1 class="titulo">CoffeeCare<span>.</span></h1>
            </a>

            <nav class="abas">
                <ul class="navbar">
                    <li><a href="index.html">Inicial</a></li>
                    <li><a href="simulador.html">Simulador</a></li>
                </ul>
            </nav>

            <div class="perfil">
                <a href="index.html">
                    <img src="assets/icon/perfil.png" alt="Perfil">
                </a>
            </div>
        </div>
    </header>
    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="caixa visivel">
        <h2>Entrar</h2>
        <input type="text" id="logUser" placeholder="E-mail">
        <input type="password" id="logPass" placeholder="Senha">
        <p id="erroLogin" class="erro"></p>

        <button type="button" onclick="entrar()">Entrar</button>
        <button type="button" onclick="mostrarRegisto()">Criar Conta</button>
    </div>

    <!-- TELA DE REGISTRO -->
    <div id="telaRegisto" class="caixa escondido">
        <h2>Criar Conta</h2>

        <input type="text" id="regUser" placeholder="Nome de Usuário" onkeyup="validarNome()">
        <p id="erroNome" class="erro"></p>

        <input type="text" id="regEmail" placeholder="E-mail" onkeyup="validacaoEmail()">
        <p id="erroEmail" class="erro"></p>

        <input type="text" id="regCnpj" placeholder="CNPJ" onkeyup="validarCnpj()">
        <p id="erroCnpj" class="erro"></p>

        <input type="password" id="regPass" placeholder="Senha" onkeyup="validacaoSenha()">
        <p id="erroSenha" class="erro">Senha precisa ter 8 caracteres no mínimo</p>

        <input type="password" id="regConfirmacao" placeholder="Confirmação da Senha" onkeyup="senhaConfirmacao()">
        <p id="erroConfirmacao" class="erro"></p>

        <p id="erroRegisto" class="erro"></p>

        <button type="button" onclick="registar()">Confirmar Registro</button>
        <button type="button" onclick="mostrarLogin()">Voltar ao Login</button>
    </div>

    <!-- TELA DE CARREGAMENTO -->
    <div id="telaCarregamento" class="caixa escondido">
        <h2>Carregando...</h2>
        <div class="loader"></div>
        <p>Acessando a Dashboard</p>
    </div>

    <script src="../js/login.js"></script>

    <script>

        function validarNome() {
            let nome = regUser.value;

            if (nome.length >= 3) {
                erroNome.innerHTML = `<p style="color: green;">Nome válido!</p>`;
                return true;
            } else {
                erroNome.innerHTML = `<p style="color: red;">Digite seu nome corretamente</p>`;
                return false;
            }
        }

        function validacaoEmail() {
            let email = regEmail.value;
            let correto = false;

            for (let i = 0; i < email.length; i++) {
                if (email[i] == '@') {
                    correto = true;
                }
            }

            if (!correto) {
                erroEmail.innerHTML = `<p style="color: red;">Email inválido</p>`;
                return false;
            } else {
                erroEmail.innerHTML = `<p style="color: green;">Email válido!</p>`;
                return true;
            }
        }

        function validacaoSenha() {
            let senha = regPass.value;

            if (senha.length < 8) {
                erroSenha.innerHTML = `<p style="color: red;">Senha precisa ter 8 caracteres no mínimo</p>`;
                return false;
            } else {
                erroSenha.innerHTML = `<p style="color: green;">Senha válida!</p>`;
                return true;
            }
        }

        function senhaConfirmacao() {
            let senha = regPass.value;
            let confirmacaoSenha = regConfirmacao.value;

            if (senha != confirmacaoSenha || confirmacaoSenha == '') {
                erroConfirmacao.innerHTML = `<p style="color: red;">Senhas diferentes</p>`;
                return false;
            } else {
                erroConfirmacao.innerHTML = `<p style="color: green;">Senhas iguais!</p>`;
                return true;
            }
        }
        function validarCnpj() {
            let cnpj = regCnpj.value;

            if (cnpj.length == 18 || cnpj.length == 14) {
                erroCnpj.innerHTML = `<p style="color: green;">CNPJ válido!</p>`;
                return true;
            } else {
                erroCnpj.innerHTML = `<p style="color: red;">CNPJ inválido!</p>`;
                return false;
            }
        }
        let utilizadores = [];

        // admin
        let admin = {
            username: 'admin',
            email: 'admin@admin',
            password: 'admin'
        };
        utilizadores[0] = admin;

        // ==========================================
        // MUDAR DE TELA (No index.html)
        // ==========================================
        function mostrarLogin() {
            telaLogin.style.display = 'block';
            telaRegisto.style.display = 'none';
            telaCarregamento.style.display = 'none';
        }

        function mostrarRegisto() {
            telaLogin.style.display = 'none';
            telaRegisto.style.display = 'block';
            telaCarregamento.style.display = 'none';
        }

        function mostrarCarregamento() {
            telaLogin.style.display = 'none';
            telaRegisto.style.display = 'none';
            telaCarregamento.style.display = 'block';
        }

        // ==========================================
        // MUDAR DE ARQUIVO HTML (Navegação)
        // ==========================================
        function mostrarDashboard() {
            location.href = 'dashboard.html';
        }

        function sair() {
            location.href = 'index.html';
        }

        // ==========================================
        // REGISTRO
        // ==========================================
        function registar() {
            let u = regUser.value;
            let e = regEmail.value;
            let t = regTelefone.value;
            let p = regPass.value;

            let existe = false;
            let i = 0;

            // Verifica se já existe usando o laço WHILE
            while (i < utilizadores.length && existe == false) {
                if (utilizadores[i].username == u || utilizadores[i].email == e) {
                    existe = true;
                }
                i++;
            }

            if (existe == true) {
                erroRegisto.innerHTML = 'Este usuário ou e-mail já existe!';
            } else {
                let novo = {
                    username: u,
                    email: e,
                    telefone: t,
                    password: p
                };

                // Adiciona no final do vetor
                let tamanho = utilizadores.length;
                utilizadores[tamanho] = novo;

                alert('Conta criada com sucesso!');

                // Limpa os campos
                regUser.value = '';
                regEmail.value = '';
                regTelefone.value = '';
                regPass.value = '';
                erroRegisto.innerHTML = '';

                mostrarLogin();
            }
        }

        function entrar() {
            let u = logUser.value;
            let p = logPass.value;

            let achou = false;
            let i = 0;

            // Procura o usuário no vetor usando o laço WHILE
            while (i < utilizadores.length && achou == false) {
                if (utilizadores[i].email == u && utilizadores[i].password == p) {
                    achou = true;
                }
                i++;
            }

            if (achou == true) {
                erroLogin.innerHTML = '';

                // Inicia a animação de loop
                mostrarCarregamento();

                // Espera 1.5 
                setTimeout(mostrarDashboard, 1500);

            } else {
                erroLogin.innerHTML = 'Dados inválidos!';
            }
        }
    </script>

</body>

</html>
