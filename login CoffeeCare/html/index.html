<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Educativo de Lógica</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="ecraLogin" class="caixa visivel">
        <h2>Entrar</h2>
        <input type="text" id="logUser" placeholder="E-mail">
        <input type="password" id="logPass" placeholder="Senha">
        <p id="erroLogin" class="erro"></p>
        
        <button type="button" onclick="entrar()">Entrar</button>
        <button type="button" onclick="mostrarRegisto()">Criar Conta</button>
    </div>

    <!-- TELA DE REGISTRO -->
    <div id="ecraRegisto" class="caixa escondido">
        <h2>Criar Conta</h2>
        <input type="text" id="regUser" placeholder="Nome de Usuário">
        <input type="text" id="regEmail" placeholder="E-mail">
        <input type="text" id="regTelefone" placeholder="Telefone">
        <input type="password" id="regPass" placeholder="Senha">
        <p id="erroRegisto" class="erro"></p>
        
        <button type="button" onclick="registar()">Confirmar Registro</button>
        <button type="button" onclick="mostrarLogin()">Voltar ao Login</button>
    </div>

    <!-- TELA DE CARREGAMENTO -->
    <div id="ecraCarregamento" class="caixa escondido">
        <h2>Carregando...</h2>
        <div class="loader"></div>
        <p>Acessando a Dashboard</p>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
